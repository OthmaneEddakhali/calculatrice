<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Calculatrice</title>
    <!-- Lien vers le fichier JavaScript externe -->
    <script type="text/javascript" src="script.js" defer></script>
</head>
<body>
    <form>
        <!-- 1re zone de texte -->
        <input type="text" id="nb1" /><br /><br />

        <!-- 2e zone de texte -->
        <input type="text" id="nb2" /><br /><br />

        <!-- Les 4 boutons d'opérations -->
        <input type="button" value="+" onclick="calculer('+')" />
        <input type="button" value="-" onclick="calculer('-')" />
        <input type="button" value="*" onclick="calculer('*')" />
        <input type="button" value="/" onclick="calculer('/')" /><br /><br />

        <!-- 3e zone de texte pour le résultat -->
        <input type="text" id="resultat" />
    </form>
</body>
</html>
