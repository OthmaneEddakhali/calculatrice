<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculatrice scientifique</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" value="0" readonly />

        <div class="scientific-grid">
            <h1>hiiiii</h1>
            <button type="button" class="function" data-action="clear">C</button>
            <button type="button" class="function" data-action="delete">DEL</button>
            <button type="button" class="function" data-action="unary" data-value="sqrt">√</button>
            <button type="button" class="operator" data-action="operator" data-value="/">÷</button>

            <button type="button" class="function" data-action="constant" data-value="pi">π</button>
            <button type="button" class="function" data-action="constant" data-value="e">e</button>
            <button type="button" class="function" data-action="unary" data-value="square">x²</button>
            <button type="button" class="operator" data-action="operator" data-value="*">×</button>

            <button type="button" class="function" data-action="unary" data-value="sin">sin</button>
            <button type="button" class="function" data-action="unary" data-value="cos">cos</button>
            <button type="button" class="function" data-action="unary" data-value="tan">tan</button>
            <button type="button" class="operator" data-action="operator" data-value="-">−</button>

            <button type="button" class="function" data-action="unary" data-value="log">log</button>
            <button type="button" class="function" data-action="unary" data-value="ln">ln</button>
            <button type="button" class="function" data-action="unary" data-value="cube">x³</button>
            <button type="button" class="operator" data-action="operator" data-value="+">+</button>

            <button type="button" class="function" data-action="unary" data-value="abs">|x|</button>
            <button type="button" class="function" data-action="unary" data-value="exp">exp</button>
            <button type="button" class="function" data-action="toggle-sign">±</button>
            <button type="button" class="operator" data-action="operator" data-value="%">%</button>

            <button type="button" class="number" data-value="7">7</button>
            <button type="button" class="number" data-value="8">8</button>
            <button type="button" class="number" data-value="9">9</button>
            <button type="button" class="operator" data-action="operator" data-value="^">xʸ</button>

            <button type="button" class="number" data-value="4">4</button>
            <button type="button" class="number" data-value="5">5</button>
            <button type="button" class="number" data-value="6">6</button>
            <button type="button" class="function" data-action="decimal">.</button>

            <button type="button" class="number" data-value="1">1</button>
            <button type="button" class="number" data-value="2">2</button>
            <button type="button" class="number" data-value="3">3</button>
            <button type="button" class="equals" data-action="equals">=</button>

            <button type="button" class="number zero" data-value="0">0</button>
            <button type="button" class="number" data-value="00">00</button>
            <button type="button" class="function" data-action="parenthesis" data-value="(">(</button>
            <button type="button" class="function" data-action="parenthesis" data-value=")">)</button>
        </div>
    </div>
</body>
</html>
